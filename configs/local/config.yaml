app:
  roles: []

server:
  addr: ":8080"
  mode: debug   # debug / release

mysql:
  # podman 部署时，容器名即主机名；本地直连用 127.0.0.1
  dsn: "gpuhealth:gpuhealth@tcp(127.0.0.1:3306)/gpu_health?charset=utf8mb4&parseTime=true&loc=Local&collation=utf8mb4_unicode_ci"
  max_open: 50
  max_idle: 10
  auto_migrate: true

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

scorer:
  cron: "@every 1m"          # 每分钟评分一次
  strategy_code: "default"   # 默认使用的评分策略
  workers: 0

simulator:
  clusters: ["clusterA", "clusterB"]
  nodes_per_cluster: 2
  gpus_per_node: 8
  node_group: "groupA"
  fault_rate: 0.125
  cron: "@every 1m"

assistant:
  enabled: true              # 开启自动故障修复
  base_url: "https://api.deepseek.com/v1"
  api_key: "sk-"
  model: "deepseek-chat"
  timeout_sec: 60
  max_history: 10            # 最多保留 10 条对话历史

ck:
  addr: "127.0.0.1:9000"
  database: "default"
  username: "default"
  password: "123456"
  table: "gpu_metrics"
  cron: "@every 1m"          # 每分钟写入一次
  window_sec: 86400            #
  metric_ttl: 86400